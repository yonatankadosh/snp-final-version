[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-precommit-agent"
version = "0.2.0"
description = "LLM-judged privacy policy scanner for Claude Code pre-commit workflows"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0,<2",
  "PyYAML>=6.0",
]

[project.scripts]
privacy-agent = "privacy_agent.cli:main"
privacy-agent-mcp = "privacy_agent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["privacy_agent*"]

[tool.setuptools.package-data]
privacy_agent = ["templates/*.yaml", "templates/policies/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
