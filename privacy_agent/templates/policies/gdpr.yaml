schema_version: 1
policy_id: gdpr
name: GDPR-oriented developer policy
version: "1.0"
description: >
  Technical pre-commit controls inspired by GDPR data minimization and special
  category protections. This policy is not legal certification.

detectors:
  email_literal:
    type: regex
    pattern: '[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}'
    maps_to: personal_data
  phone_literal:
    type: regex
    pattern: '(?<!\w)(?:\+?[0-9][0-9(). -]{7,}[0-9])(?!\w)'
    maps_to: personal_data
  ip_literal:
    type: regex
    pattern: '(?<![\d.])(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?![\d.])'
    maps_to: online_identifier
  sensitive_logging:
    type: regex
    pattern: '(?:log(?:ger)?\.(?:debug|info|warning|error|critical)|print)\s*\([^\n]*(?:full_name|email|phone|address|birth|ip_address|genetic|biometric|religion|sexual_orientation|health)'
    maps_to: disclosure_path
  special_category_literal:
    type: regex
    pattern: '["''][^"'']*(?:genetic|biometric|religious belief|political opinion|sexual orientation|health condition|hiv)[^"'']*["'']'
    maps_to: special_category_data
  personal_data_export:
    type: regex
    pattern: '(?:write|writerow|to_csv|to_json|export)[^\n]*(?:full_name|email|phone|address|birth|ip_address|genetic|biometric|health)'
    maps_to: disclosure_path

rules:
  - id: GDPR-001
    name: No hardcoded personal data
    severity: high
    risk_score: 70
    detectors: [email_literal, phone_literal, ip_literal]
    remediation:
      strategy: remove_personal_data_literal
      suggestion: Replace hardcoded personal data with synthetic data or a protected runtime reference.
      agent_steps:
        - Remove the matched personal-data literal without changing unrelated behavior.
        - Use a clearly synthetic fixture, generated value, or runtime configuration reference.
        - Confirm the value was not copied into another tracked source file.
      verify: Re-run the originating code scan and confirm this finding is absent.

  - id: GDPR-002
    name: No personal or special-category data in logs
    severity: high
    risk_score: 85
    detectors: [sensitive_logging]
    remediation:
      strategy: minimize_logging
      suggestion: Log only an event ID or pseudonymous identifier needed for operations.
      agent_steps:
        - Remove personal and special-category fields from the output call.
        - Retain only the minimum operational metadata needed to debug the event.
        - Preserve the existing logging level unless the fix requires otherwise.
      verify: Re-run the originating code scan and confirm the logging path is clean.

  - id: GDPR-003
    name: No hardcoded special-category data
    severity: very_high
    risk_score: 95
    detectors: [special_category_literal]
    remediation:
      strategy: remove_special_category_literal
      suggestion: Remove special-category data from source and use synthetic fixtures for tests.
      agent_steps:
        - Remove or replace the special-category literal with clearly synthetic data.
        - Preserve the behavior being tested.
        - Do not weaken access or validation logic as part of this change.
      verify: Re-run the originating code scan and confirm the literal is absent.

  - id: GDPR-004
    name: Minimize personal data in exports
    severity: high
    risk_score: 80
    detectors: [personal_data_export]
    remediation:
      strategy: minimize_export
      suggestion: Export only necessary fields, preferring aggregate or pseudonymous values.
      agent_steps:
        - Remove personal fields not required by the export purpose.
        - Replace direct identifiers with pseudonymous IDs where possible.
        - Preserve the export schema only for fields that remain necessary.
      verify: Re-run the originating code scan and confirm the export path is clean.
